name: 测试并发布（网页到 GitHub Pages，PC 试玩包到 Releases）

on:
  push:
    branches: [main]
    # 网站只由 src/、web/ 构建。只改文档、协作说明、工具脚本的推送不构建：
    # 策划案先于实现时不发失败邮件；开发方的纯文档提交（待确认问题、开发记录）也不用每次重发一遍网站。
    # 一次推送里只要有一个文件不在下面这些路径里，照常构建。
    paths-ignore:
      - 'doc/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'CLAUDE.md'
      - '.claude/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 内核测试
        run: dotnet test web/Moyu.sln -c Release

      - name: 发布 Blazor WebAssembly
        run: dotnet publish web/Moyu.Web -c Release -o publish

      - name: 适配 Pages 子路径
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO}/\" />|" publish/wwwroot/index.html
          BUILD="$(date -u +%Y-%m-%d) · ${GITHUB_SHA::7}"
          sed -i "s|<meta name=\"app-build\" content=\"本地开发版\" />|<meta name=\"app-build\" content=\"${BUILD}\" />|" publish/wwwroot/index.html
          sed -i "s|</body>|<div style=\"position:fixed;left:6px;bottom:2px;font-size:11px;color:#8b90a0;pointer-events:none;z-index:999\">构建 ${BUILD}</div></body>|" publish/wwwroot/index.html
          # 自写的脚本与样式加上提交号，发布后浏览器立即取新文件，不用旧缓存
          sed -i "s|?v=dev|?v=${GITHUB_SHA::7}|g" publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # 沿用适者生存：Pages 发布偶尔卡满 10 分钟超时；第一次只等 3 分钟，不成自动再发一次
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 180000
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # PC 试玩包：内核测试过了才打，在 Windows 上打成 zip（Electron 运行时 + 网页包 + 自带运行时的采集程序），
  # 用打好的包跑 B6 全套（含 b4 窗口、b5 系统层面的真实按键点击，这台机器自己的桌面，不占开发机），
  # 过了才发到固定的 Releases pc-latest：标签挪到这次提交、替换包，下载地址不变。和网页发布互不等待。
  pc:
    needs: build
    # 固定 2022：b5 用经典记事本（Edit 控件）读收到的字数
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 装 Electron
        working-directory: pc
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: 打 PC 试玩包并验收（b6：打包、解开、正常启动，用包跑 b4、b5）
        # 结果放到 pc/dist 外面：打包时会先清空 pc/dist
        run: node tools/verify/b6.mjs --release "${{ runner.temp }}/pc-verify"

      - name: 验收结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-verify
          path: ${{ runner.temp }}/pc-verify
          if-no-files-found: ignore

      - name: 发布到 Releases（pc-latest）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=pc/dist/zhuomianmoyu-pc-win-x64.zip
          SHA="${GITHUB_SHA::7}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/pc-latest/zhuomianmoyu-pc-win-x64.zip"
          # 说明用 heredoc 写，里面的引号、反斜杠不经 shell 转义
          NOTES=$(cat <<NOTES_END
          构建 $(date -u +%Y-%m-%d) · ${SHA}（每次推送 main 自动更新）

          下载：${URL}

          解压后双击「桌面摸鱼/桌面摸鱼.exe」。没签名，第一次打开 Windows 会提示"已保护你的电脑"，点"更多信息 → 仍要运行"。
          存档在 %APPDATA%\moyu-pc，换新包不丢。
          NOTES_END
          )
          git tag -f pc-latest "$GITHUB_SHA"
          git push -f origin refs/tags/pc-latest
          if gh release view pc-latest >/dev/null 2>&1; then
            gh release upload pc-latest "$ZIP" --clobber
            gh release edit pc-latest --title "PC 试玩版 ${SHA}" --notes "$NOTES" --latest
          else
            gh release create pc-latest "$ZIP" --title "PC 试玩版 ${SHA}" --notes "$NOTES" --latest
          fi

      # B7：每次都截一套存成附件，方便隔批对比；放在发布后面、出错也不挡发布。看图由开发方每批做一次
      - name: 截图巡检（不挡发布）
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive pc/dist/zhuomianmoyu-pc-win-x64.zip "$env:RUNNER_TEMP/shots-app" -Force
          $env:MOYU_PC_APP = (Get-ChildItem "$env:RUNNER_TEMP/shots-app/*/*.exe" | Select-Object -First 1).FullName
          node tools/verify/shots.mjs --release "$env:RUNNER_TEMP/shots"

      - name: 截图附件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
